<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Dubcey">
<meta name="application-name" content="Dubcey">

<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Shrikhand&family=Zilla+Slab:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=UnifrakturCook:wght@700&family=Pirata+One&family=Bungee+Inline&display=swap" rel="stylesheet">

<body>
<div class="bg">
<header id="top"></header>
<div class="in">
  <div class="pagehd"><div><div class="k mono">FREE AGENTS · SEARCH · WAIVER CLAIMS</div><h1>Players</h1></div><nav class="tabs mono" id="ptabs"><a href="#list" data-v="list">PLAYERS</a><a href="#top" data-v="top">TOP SCORERS</a><a href="#news" data-v="news">NEWS &amp; INJURIES</a></nav></div>
  <div id="vnews" hidden><div class="ld mono">LOADING NEWS…</div></div>
  <div id="vtop" hidden><div class="ld mono">LOADING TOP SCORERS…</div></div>
  <div id="vlist">
  <div class="filt">
    <input id="q" type="search" placeholder="Search a player or NFL team" autocomplete="off">
    <div class="seg mono"><button type="button" data-pos="ALL">ALL</button><button type="button" data-pos="QB">QB</button><button type="button" data-pos="RB">RB</button><button type="button" data-pos="WR">WR</button><button type="button" data-pos="TE">TE</button></div>
    <div class="seg mono"><button type="button" data-fa="1">FREE AGENTS</button><button type="button" data-fa="r">ROSTERED</button><button type="button" data-fa="0">EVERYONE</button></div>
    <span class="mono pcount" id="cnt"></span>
  </div>
  <div class="filt f2 mono">
    <label>SHOW<select id="vw"><option value="ov">Overview</option><option value="wk">Weekly points</option><option value="pass">Passing stats</option><option value="rush">Rushing stats</option><option value="rec">Receiving stats</option></select></label>
    <label>WEEK<select id="wf"></select></label><label>THROUGH<select id="wt"></select></label>
    <label>STATUS<select id="ownf"><option value="1">Free agents</option><option value="r">Any roster</option><option value="0">Everyone</option></select></label>
    <label>NFL TEAM<select id="tmf"><option value="">Any team</option></select></label>
    <label>TOP<select id="lim"><option>25</option><option>50</option><option selected>100</option><option>200</option></select></label>
    <span class="f2n" id="f2n"></span>
  </div>
  <div class="duo trend" id="trend" hidden><article class="card" id="tadd"></article><article class="card" id="tdrop"></article></div>
  <article class="card" id="plist" style="margin-bottom:44px"><div class="ld mono">LOADING PLAYERS…</div></article>
  </div>
</div>
</div>
<div class="toast mono" id="toast" hidden></div>
